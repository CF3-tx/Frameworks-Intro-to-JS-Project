<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Mexico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script_contact.js"></script>
    <link rel="stylesheet" href="styles_contact.css">

</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
            <img src="Images/logo.png" alt="logo" width="150">
        </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="trips.html">Trips</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>

            </ul>
        </div>
    </div>
</nav>

    <!-- Login Form -->
    <div class="form-container py-5">
        <h2 class="text-center">Contact Us</h2>
        <form class="border p-4 shadow-sm bg-light needs-validation">
            <div class = "mb-3 p-0 form-check form-check-inline">
                <label for="name" class="form-label">First Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your first name" required>
            </div>
            <div class = "mb-3 p-0 form-check form-check-inline">
                <label for="name" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your last name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-3" style="display: flex; gap: 20px;">
                <label for="services" class="form-label">Services of Interest:</label>
                <label><input type="checkbox" name="services"> Historical Tours</label>
                <label><input type="checkbox" name="services"> Food Tours</label>
                <label><input type="checkbox" name="services"> Travel Arrangements</label>
                <label><input type="checkbox" name="services"> Event Planning</label>
                <label><input type="checkbox" name="services"> Other</label>
              </div>
            <div class="mb-3">
                <label for="comments" class="form-label">Comments</label>
                <textarea type="comments" class="form-control" id="comments" placeholder="Share your thoughts with us." rows="3"></textarea>
            <div class = "form-check mt-3 mb-3">
                <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" required>
                <label class="form-check-label" for="flexCheckDefault"> Agree to terms and conditions
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit</button>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <footer class="bg-black text-light py-3">
        <div class="f-container text-light text center">
            <p class="fp1 display-5 mb-3">Términos y Condiciones </p>
            <p class="fp2 display-5 mb-3">México®️, visitmexico.com®️, visitmexico®️, Pueblos Mágicos®️, Atención al Turista 078®️, Atlas Turístico de México®️, RNT®️, are trademarks registered in favor of the Ministry of Tourism of the Government of Mexico.</p>  
        </div>
        <div class="d-grid gap-2 col-6 mx-auto">
            <button onclick="toTop()" class="btn btn-secondary" type="button">Back to Top</button>
        </div>

    </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>    
</body>
</html>
